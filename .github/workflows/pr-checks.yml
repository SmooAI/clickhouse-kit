name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchains come from mise.toml (node). pnpm stays on action-setup so it
      # keeps reading the "packageManager" pin in package.json.
      - name: Setup toolchains (mise)
        uses: jdx/mise-action@v4

      - uses: pnpm/action-setup@v4

      - name: Locate pnpm store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # Fails (never warns) if the crate manifests have drifted from package.json.
      - name: Version lockstep check
        run: pnpm version:check

      - name: Build
        run: pnpm build
