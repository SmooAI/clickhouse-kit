name: Release (Changesets 🦋)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  CI: true

jobs:
  version:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    # Publish to npm when the org's NPM_TOKEN secret is visible to this repo;
    # otherwise fall back to version-only mode (open the "Version Packages" PR
    # when changesets exist) rather than failing the run. The token IS configured
    # — @smooai/clickhouse-kit publishes from here — so the fallback is a
    # safety net for a token/visibility lapse, not a pre-launch placeholder.
    env:
      HAS_NPM_TOKEN: ${{ secrets.SMOOAI_NPM_TOKEN != '' }}
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Also on main, not just PRs: `changeset version` rewrites CHANGELOG.md,
      # and an unformatted result used to land silently here and then red-line
      # the next unrelated PR (that is what commit #14 was cleaning up).
      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # Fails (never warns) if the crate manifests have drifted from package.json.
      - name: Version lockstep check
        run: pnpm version:check

      - name: Build
        run: pnpm build

      # `pnpm run version` = `changeset version && sync-versions && format`, so
      # the crate manifests are bumped — and the rewritten CHANGELOG formatted —
      # inside the release commit rather than after publish.
      - name: Changesets — version (+ publish when NPM_TOKEN present) 🦋
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: ${{ env.HAS_NPM_TOKEN == 'true' && 'pnpm ci:publish' || '' }}
          commit: "🦋 New version release"
          title: "🦋 New version release"
          createGithubReleases: ${{ env.HAS_NPM_TOKEN == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.SMOOAI_NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.SMOOAI_NPM_TOKEN }}
