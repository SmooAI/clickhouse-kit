name: Rust

on:
  # `spec/**` is in the filter because the cross-language parity corpus lives
  # there: adding a case to it must run BOTH languages' suites, and a filter of
  # `crates/**` alone would leave the Rust half unrun on a corpus-only change.
  pull_request:
    branches: [main]
    paths: ["crates/**", "spec/**", ".github/workflows/rust.yml"]
  push:
    branches: [main]
    paths: ["crates/**", "spec/**"]

defaults:
  run:
    working-directory: crates/clickhouse-kit

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (unit)
        run: cargo test
      - name: Test (integration — real ClickHouse via testcontainers)
        run: cargo test --test integration -- --ignored
